name: ci

# **画面は依存を持たない。だからこの job は何も install しない** —— 在るのは node の
# http サーバ 1 本と、ブラウザで素のまま走る JS だけで、監査する依存木が無い
# (capture-scripts と同じ判断)。依存が在るのは docs-site/ だけで、その監査は audit.yml、
# 検査は site.yml、公開は docs.yml が持つ。
#
# 走らせるのは `npm run check` (中身は package.json の `check`)。**中継と名乗りは
# ここでは見ない** —— あれは台帳と issuer が立っていないと確かめられないので、
# 証拠は手で当てて PR に貼る。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Check
        run: npm run check
