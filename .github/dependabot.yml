# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
#
# Dependabot が読むのは **default branch (main) に置かれたこのファイル** だけ。
# PR も main へ出す (`target-branch` を書かなければ、default branch 宛てになる)。
#
# dashboard (repo の根) は npm の依存を持たない。npm の lockfile は docs-site と highlighter の 2 本
# なので、npm の entry はその 2 つの directory に置く (root の entry はどちらにも届かない)。
version: 2
updates:
  # ── docs-site (Astro) ──
  #
  # 本番コードではなくドキュメントのビルド専用なので、種類で分けずに **全部 1 本**
  # にまとめる。上限も 1。
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
      day: monday
    # 版が枯れてから PR 化する (supply-chain 対策)。security 更新には適用されない
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 1
    versioning-strategy: increase
    ignore:
      # mermaid は major を上げない (11 系に留める)。
      #
      # astro-mermaid が、最新の 2.1.0 でも peer で `mermaid: ^10.0.0 || ^11.0.0` を要求する。
      # 上げると npm ci が ERESOLVE で **必ず** 落ちる (#19 が実際にそうなった)。
      # docs-site/package.json の "//" に書いた理由と同じ。
      #
      # **astro-mermaid が mermaid 12 を受ける版を出したら、この entry を消すこと。** 確認は:
      #   npm view astro-mermaid@latest peerDependencies.mermaid
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]
    groups:
      docs-site:
        patterns:
          - "*"

  # ── highlighter (public/vendor/shiki.js を作る元) ──
  #
  # PR は package.json と lockfile しか変えないので、vendor.yml が赤になる。その PR の枝で
  # `npm run vendor` を走らせ、作り直した shiki.js と shiki.LICENSES.txt を commit してから入れる。
  - package-ecosystem: npm
    directory: /highlighter
    schedule:
      interval: weekly
      day: monday
    # 束ねて dashboard で走らせるので、docs-site より長く枯らす。security 更新には適用されない
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    versioning-strategy: increase
    groups:
      highlighter:
        patterns:
          - "*"

  # ── GitHub Actions ──
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # github-actions は default-days のみ対応
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
